# ──────────────────────────────────────────────────────────────────────────────
# acme-widgets.conf  —  ACME Widgets 2.1.0 default configuration
#
# This file is installed to {install-dir}/etc/acme-widgets.conf
# User overrides: ~/.acme-widgets/acme-widgets.conf  (Linux/macOS)
#                 %APPDATA%\ACME Corporation\acme-widgets.conf  (Windows)
# ──────────────────────────────────────────────────────────────────────────────

[General]
version         = 2.1.0
vendor          = ACME Corporation
log-level       = info
log-file        = /var/log/acme-widgets/acme-widgets.log
update-check    = true

[Service]
host            = 127.0.0.1
port            = 8420
max-connections = 100
idle-timeout    = 300

[Widgets]
enabled         = true
auto-start      = false
data-dir        = {install-dir}/share/acme-widgets
cache-size-mb   = 64

[Security]
require-auth    = false
token-expiry-s  = 3600
tls-enabled     = false

[Display]
theme           = system
accent-color    = #0078d4
font-size       = 12
animations      = true
