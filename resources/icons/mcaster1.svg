<?xml version="1.0" encoding="UTF-8"?>
<!--
  mcaster1.svg — Mcaster1 Install System application icon
  Canonical SVG source: used to generate mcaster1.icns at build time
  and rendered at runtime via QSvgRenderer for the dock / taskbar icon.

  Design: dark-blue gradient background, hexagonal package silhouette,
  "M1" logotype, cyan accent stroke, wrench motif upper-right.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#00c9ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="44" height="44" rx="10" ry="10"
        fill="url(#bg-grad)" opacity="0.92"/>

  <!-- Hex package outline -->
  <path d="M10 30 L10 18 L24 11 L38 18 L38 30 L24 37 Z"
        fill="none" stroke="#00c9ff" stroke-width="1.8" opacity="0.85"/>

  <!-- Lid divider -->
  <path d="M10 18 L24 25 L38 18"
        fill="none" stroke="#00c9ff" stroke-width="1.4" opacity="0.7"/>

  <!-- M1 logotype -->
  <text x="24" y="29" text-anchor="middle"
        font-family="system-ui,sans-serif" font-weight="700"
        font-size="9" fill="#ffffff" letter-spacing="0.5">M1</text>

  <!-- Wrench accent (scaled, upper-right corner) -->
  <path d="M33 10 Q36 7 39 10 L34.5 14.5 L36 16 L31.5 20.5 L30 19 L25.5 23.5
           Q22 26 19 23 Q16 20 19 17 Q22 14 25.5 17.5 L30 13 L31.5 14.5 Z"
        fill="#00c9ff" opacity="0.6" transform="scale(0.45) translate(24,2)"/>
</svg>
